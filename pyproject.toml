[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krita-mcp"
version = "1.0.0"
description = "MCP server + Krita plugin so any AI agent (Claude, ChatGPT, Gemini, ...) can paint, edit and generate art, photos, animation and video in Krita, with ComfyUI, A1111, OpenAI, Gemini, Stability, Replicate, fal and HeyGen"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "uvicorn>=0.30"]
keywords = ["krita", "mcp", "model-context-protocol", "ai", "art", "painting", "photo-editing", "animation", "generative-ai", "stable-diffusion", "comfyui", "inpainting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/jowinjohnchemban/krita-mcp"
Documentation = "https://github.com/jowinjohnchemban/krita-mcp/tree/main/docs"
Issues = "https://github.com/jowinjohnchemban/krita-mcp/issues"
Releases = "https://github.com/jowinjohnchemban/krita-mcp/releases"

[project.optional-dependencies]
test = ["pytest>=8"]
anthropic = ["anthropic>=0.70"]

[project.scripts]
krita-mcp = "krita_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/krita_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
