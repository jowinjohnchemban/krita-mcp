[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kritapilot"
version = "1.0.0"
description = "Krita MCP server and AI assistant: AI agents (Claude, ChatGPT, Gemini, Cursor, ...) and an AI Chat inside Krita paint, edit and generate art, photos, animation and video, with ComfyUI, OpenAI, Gemini, free models and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jowinjohnchemban" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "uvicorn>=0.30"]
keywords = ["krita", "krita-mcp", "krita-mcp-server", "krita-plugin", "krita-ai", "mcp", "mcp-server", "model-context-protocol", "ai", "ai-agents", "art", "painting",
            "digital-painting", "photo-editing", "animation", "generative-ai", "stable-diffusion", "comfyui",
            "inpainting", "claude", "openrouter", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Environment :: Plugins",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jowinjohnchemban/kritapilot"
Repository = "https://github.com/jowinjohnchemban/kritapilot"
Documentation = "https://github.com/jowinjohnchemban/kritapilot/tree/main/docs"
Issues = "https://github.com/jowinjohnchemban/kritapilot/issues"
Releases = "https://github.com/jowinjohnchemban/kritapilot/releases"
Changelog = "https://github.com/jowinjohnchemban/kritapilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
anthropic = ["anthropic>=0.70"]

[project.scripts]
kritapilot = "kritapilot.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kritapilot"]

[tool.hatch.build.targets.wheel.force-include]  # `kritapilot install` puts this plugin into Krita
"plugin/pykrita/kritapilot_plugin" = "kritapilot/krita_plugin/kritapilot_plugin"
"plugin/pykrita/kritapilot_plugin.desktop" = "kritapilot/krita_plugin/kritapilot_plugin.desktop"

[tool.pytest.ini_options]
testpaths = ["tests"]
