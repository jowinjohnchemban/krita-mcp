[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krita-mcp"
version = "0.1.0"
description = "MCP server + Krita plugin so any AI agent (Claude, ChatGPT, Gemini, ...) can edit and generate art in Krita"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
krita-mcp = "krita_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/krita_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
