# Snyk code (SAST) scan (dependencies are covered by the OSV-Scanner workflow). Needs a free Snyk API token saved as the repository secret SNYK_TOKEN
# (https://app.snyk.io/account -> Auth Token; GitHub: Settings > Secrets and variables > Actions).
# Without that secret the scan is skipped (not failed), so forks and new setups stay green.

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check for the Snyk token
        id: token
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::SNYK_TOKEN is not set; skipping the Snyk scan."; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Set up Snyk CLI
        if: steps.token.outputs.present == 'true'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Exit code 1 only means "issues found"; they go to the Security tab, so only real errors (2+) fail the job.
      - name: Snyk Code test
        if: steps.token.outputs.present == 'true'
        run: snyk code test --sarif-file-output=snyk-code.sarif || [ $? -eq 1 ]

      - name: Upload result to GitHub Code Scanning
        if: steps.token.outputs.present == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
