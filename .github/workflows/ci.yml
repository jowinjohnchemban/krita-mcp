name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.qt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]  # 24.04 ships Python 3.10; newer images download it, which can fail
        python: ["3.10", "3.13"]
        qt: [PyQt6, PyQt5]
    env:
      QT_QPA_PLATFORM: offscreen
      KRITA_TEST_QT: ${{ matrix.qt == 'PyQt5' && '5' || '6' }}
    steps:
      - uses: actions/checkout@v4
      # GitHub's Python download sometimes answers HTTP 504; wait and try again before giving up
      - uses: actions/setup-python@v5
        id: python
        continue-on-error: true
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Wait before retrying the Python download
        if: steps.python.outcome == 'failure'
        run: python -c "import time; time.sleep(45)"
        shell: bash
      - uses: actions/setup-python@v5
        if: steps.python.outcome == 'failure'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for headless Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test]" ${{ matrix.qt }} pyflakes
      - name: Lint
        run: python -m pyflakes src scripts tests plugin
      - name: Tests
        run: python -m pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: python scripts/build_plugin.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: krita-plugin
          path: dist/*.zip
