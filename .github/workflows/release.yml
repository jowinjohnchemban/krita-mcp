#
# Publish KritaPilot on every push to main: the Krita plugin zip and the server's wheel and sdist go to a GitHub
# release, and the wheel and sdist to PyPI (https://pypi.org/p/kritapilot).
#
# Jobs, as in PyPA's guide (https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/):
#   build           version, test, build everything once and keep it as the "dist" artifact
#   github-release  publish the artifact as a GitHub release (the plugin and the server update from there)
#   pypi            upload the wheel and sdist with PyPI trusted publishing - no password or token is stored
#
# The version is the date plus the build number (YYYY.M.D.<run number>), so several releases a day each get their
# own version, and nothing is ever committed to the repository.
#

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true  # a newer push supersedes a release still being built

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the date and the build number
        id: version
        env:
          BUILD: ${{ github.run_number }}  # grows with every build, so later builds always compare as newer
        run: |
          echo "tag=$(date -u +'%Y.%m.%d').${BUILD}" >> "$GITHUB_OUTPUT"      # tag / release name
          echo "version=$(date -u +'%Y.%-m.%-d').${BUILD}" >> "$GITHUB_OUTPUT" # the same as a Python version
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -e ".[test]" PyQt6 build twine

      - name: Stamp the version (this build only, never committed)
        run: python scripts/bump_version.py "${{ steps.version.outputs.version }}"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build plugin zip, wheel and sdist
        run: |
          python scripts/build_plugin.py --out dist
          python -m build --outdir dist
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          {
            echo "## 📦 KritaPilot ${{ steps.version.outputs.version }} (build ${{ github.run_number }}, commit ${{ steps.version.outputs.commit }})"
            echo
            ls -lh dist | awk 'NR>1 {print "- **" $9 "**: " $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG_NAME: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Delete an existing release of this build  # only when this same build is re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${TAG_NAME}" --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: KritaPilot ${{ env.VERSION }} (build ${{ github.run_number }}, ${{ env.COMMIT }})
          make_latest: true
          generate_release_notes: true
          body: |
            Build ${{ github.run_number }} from commit [`${{ env.COMMIT }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ## Install

            **Krita plugin**: download `krita-mcp-bridge-${{ env.VERSION }}.zip`, then in Krita choose *Tools > Scripts >
            Import Python Plugin from File...*, pick the zip, enable it and restart Krita. Open *Settings > Dockers >
            AI Chat* or *AI Bridge (MCP)*.

            **Server** (the Krita MCP server and the AI Chat assistant): `pip install kritapilot==${{ env.VERSION }}`,
            or `pip install` the `.whl` from this release. Then chat inside Krita with *AI Chat*, or connect your AI
            app with the snippet shown in the Krita panel.

            Already installed? The plugin and the server update themselves.

            Docs: https://github.com/${{ github.repository }}/tree/main/docs · Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.2.1
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/kritapilot
    permissions:
      id-token: write  # trusted publishing: PyPI checks this workflow's identity instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Keep only the Python packages
        run: rm -f dist/*.zip

      - uses: pypa/gh-action-pypi-publish@release/v1
