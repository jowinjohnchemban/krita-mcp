name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        id: v
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then echo "::error::tag $TAG does not match version $VERSION"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -e ".[test]" PyQt6 build
          python -m pytest -q
      - name: Build plugin zip, wheel and sdist
        run: |
          python scripts/build_plugin.py --out dist
          python -m build --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        shell: bash
        run: |
          NOTES="$(cat <<'NOTES_EOF'
          ## Install

          **Krita plugin** - download `krita-mcp-bridge-*.zip`, then in Krita: *Tools > Scripts > Import Python
          Plugin from File...*, pick the zip, enable it, restart Krita. Open *Settings > Dockers > AI Bridge (MCP)*.

          **MCP server** - `pip install krita_mcp-*.whl` from this release (or `pip install krita-mcp` once on PyPI),
          then connect your AI client with the snippet shown in the Krita panel.

          Docs: https://github.com/${{ github.repository }}/tree/main/docs
          NOTES_EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "krita-mcp $TAG" --notes "$NOTES" --verify-tag
          fi

  pypi:
    # Opt in: set the repository variable PUBLISH_PYPI=true and add this repo as a trusted publisher on PyPI.
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Keep only Python packages
        run: rm -f dist/*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
