#
# Publish KritaPilot on every push to main: the Krita plugin zip and the server's wheel and sdist go to a GitHub
# release, and the wheel and sdist to PyPI (https://pypi.org/p/kritapilot).
#
# Jobs, as in PyPA's guide (https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/):
#   tests           the whole CI matrix (Windows and Linux, Python 3.10 and 3.13, PyQt5 and PyQt6)
#   build           next version, build everything once and keep it as the "dist" artifact (only after all tests pass)
#   github-release  publish the artifact as a GitHub release (the plugin and the server update from there)
#   pypi            upload the wheel and sdist with PyPI trusted publishing - no password or token is stored
#
# Versions are SemVer and count up by one: MAJOR.MINOR from pyproject.toml, PATCH one more than the highest already
# published (GitHub or PyPI). The tag is vX.Y.Z and official names use only the version. Each build also has a
# build id, the build date and commit (YYYYMMDD-COMMIT), shown in the release notes and the app. Nothing is committed.
#

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true  # a newer push supersedes a release still being built

jobs:
  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml  # every OS, Python and Qt version; nothing is published unless all pass

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -e . build twine

      - name: Next version, build id and commit (stamped in this build only)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_version.py --repo "${{ github.repository }}" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip, wheel and sdist
        run: |
          python scripts/build_plugin.py --out dist
          python -m build --outdir dist
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          {
            echo "## 📦 KritaPilot ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
            echo
            ls -lh dist | awk 'NR>1 {print "- **" $9 "**: " $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_ID: ${{ needs.build.outputs.build }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: KritaPilot ${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
          body: |
            Version **${{ env.VERSION }}** · build `${{ env.BUILD_ID }}` ([commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }}))

            ## Install

            **Server** (the Krita MCP server and the AI Chat assistant), from PyPI or from GitHub:

            ```bash
            pip install kritapilot==${{ env.VERSION }}
            pip install "git+https://github.com/${{ github.repository }}@v${{ env.VERSION }}"
            ```

            **Krita plugin**: download `kritapilot-plugin-${{ env.VERSION }}.zip` below, then in Krita choose *Tools >
            Scripts > Import Python Plugin from File...*, pick the zip, enable it and restart Krita. Open *Settings >
            Dockers > AI Chat* or *AI Bridge (MCP)*.

            Already installed? The plugin and the server update themselves.

            Docs: https://github.com/${{ github.repository }}/tree/main/docs · Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/kritapilot
    permissions:
      id-token: write  # trusted publishing: PyPI checks this workflow's identity instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Keep only the Python packages
        run: rm -f dist/*.zip

      - uses: pypa/gh-action-pypi-publish@release/v1
