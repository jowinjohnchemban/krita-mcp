#
# File: .github/workflows/release.yml
# Description: Publish krita-mcp (Krita plugin zip + MCP server wheel/sdist) on every push to main
#
# Modelled on GeoLite.mmdb's publisher: one job, the date is the version (YYYY.MM.DD), a release made the same
# day is replaced, only the latest releases are kept, and nothing is ever committed to the repository.
#

name: Release

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true  # a newer push supersedes a release still being built

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the date
        run: |
          echo "TAG_NAME=$(date -u +'%Y.%m.%d')" >> "$GITHUB_ENV"   # tag / release name, like GeoLite
          echo "VERSION=$(date -u +'%Y.%-m.%-d')" >> "$GITHUB_ENV"   # the same date as a Python version

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -e ".[test]" PyQt6 build

      - name: Stamp the version (this build only, never committed)
        run: python scripts/bump_version.py "$VERSION"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build plugin zip, wheel and sdist
        run: |
          python scripts/build_plugin.py --out dist
          python -m build --outdir dist
          ls -lah dist
          {
            echo "## 📦 krita-mcp $TAG_NAME"
            echo
            ls -lh dist | awk 'NR>1 {print "- **" $9 "**: " $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Delete existing release/tag if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${TAG_NAME}" --yes || true
          git push --delete origin "${TAG_NAME}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: krita-mcp ${{ env.TAG_NAME }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Install

            **Krita plugin**: download `krita-mcp-bridge-${{ env.VERSION }}.zip`, then in Krita choose *Tools > Scripts >
            Import Python Plugin from File...*, pick the zip, enable it and restart Krita. Open *Settings > Dockers >
            AI Chat* or *AI Bridge (MCP)*.

            **MCP server**: `pip install krita_mcp-${{ env.VERSION }}-py3-none-any.whl` from this release, then connect
            your AI client with the snippet shown in the Krita panel, or chat inside Krita with *AI Chat*.

            Docs: https://github.com/${{ github.repository }}/tree/main/docs
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.2.1
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    # Opt in: set the repository variable PUBLISH_PYPI=true and add this repo as a trusted publisher on PyPI.
    if: vars.PUBLISH_PYPI == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Keep only Python packages
        run: rm -f dist/*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
