name: Release

# Releases publish themselves. When CI passes on main, scripts/release_plan.py decides:
#   * plugin / server code changed since the last release -> next version (patch; [minor] / [major] in a
#     commit message picks a bigger step), committed to main by github-actions[bot];
#   * the version in pyproject.toml was raised by hand -> that version;
#   * only docs / tests / CI changed -> nothing.
# Then it tests, builds the Krita plugin zip + wheel + sdist, tags the commit and publishes the release
# (and PyPI if enabled). Pushing a tag v* by hand still works; "Run workflow" re-publishes a tag or releases main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-publish (e.g. v0.3.0). Empty = release the version on main if it is new."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    # After CI only when CI passed, and only for pushes to main (not pull requests from forks).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      bump: ${{ steps.v.outputs.bump }}
    steps:
      - name: Which commit
        id: ref
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            workflow_run) echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT" ;;
            push)         echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *)            echo "ref=${INPUT_TAG:-main}" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0  # tags + history, to see what changed since the last release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version, tag and whether to publish
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] || [ -n "$INPUT_TAG" ]; then  # explicit tag: (re)publish exactly that
            VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            REQUESTED="${INPUT_TAG:-$GITHUB_REF_NAME}"
            if [ "$REQUESTED" != "v$VERSION" ]; then
              echo "::error::tag $REQUESTED does not match the package version $VERSION"; exit 1
            fi
            { echo "version=$VERSION"; echo "tag=v$VERSION"; echo "publish=true"; echo "bump=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/release_plan.py --github-output "$GITHUB_OUTPUT"

  bump:
    # Commit the new version to main (as github-actions[bot]; such pushes do not trigger CI again).
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.bump == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commit the version bump
        id: commit
        shell: bash
        env:
          TESTED: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "::notice::main moved on after this CI run; the next CI run will release it"
            exit 0
          fi
          python -m pip install -q -e .
          python scripts/bump_version.py "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, bump]
    # bump is skipped for manual versions; when it ran it must have committed (main had not moved on)
    if: >-
      always() && needs.prepare.outputs.publish == 'true' &&
      (needs.bump.result == 'skipped' || (needs.bump.result == 'success' && needs.bump.outputs.sha != ''))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.bump.outputs.sha || needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree (pyproject, server, plugin)
        run: python -m pip install pytest && python -m pytest -q tests/test_meta.py -k version
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -e ".[test]" PyQt6 build
          python -m pytest -q
      - name: Build plugin zip, wheel and sdist
        run: |
          python scripts/build_plugin.py --out dist
          python -m build --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: |
          cat > notes.md <<NOTES_EOF
          ## Install

          **Krita plugin**: download \`krita-mcp-bridge-${TAG#v}.zip\`, then in Krita choose *Tools > Scripts >
          Import Python Plugin from File...*, pick the zip, enable it and restart Krita. Open *Settings > Dockers >
          AI Bridge (MCP)*.

          **MCP server**: \`pip install krita_mcp-${TAG#v}-py3-none-any.whl\` from this release (or
          \`pip install krita-mcp\` once it is on PyPI), then connect your AI client with the snippet shown in the
          Krita panel. Image, video and vision services: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/ai-backends.md

          NOTES_EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          elif git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "krita-mcp $TAG" \
              --notes-file notes.md --generate-notes --verify-tag
          else  # creates the tag on exactly the commit that passed CI
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "krita-mcp $TAG" \
              --notes-file notes.md --generate-notes --target "$SHA"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[].name)'

  pypi:
    # Opt in: set the repository variable PUBLISH_PYPI=true and add this repo as a trusted publisher on PyPI.
    if: always() && vars.PUBLISH_PYPI == 'true' && needs.build.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Keep only Python packages
        run: rm -f dist/*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
