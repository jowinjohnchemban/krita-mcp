name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of this you fill in, the faster it can be fixed.
        Security problems: please don't post them here - see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did (or asked the AI), what you expected, and what happened instead.
      placeholder: |
        I asked the AI Chat (provider: Auto) to "paint a sunset over mountains".
        Expected: a painting. Instead: ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Krita, the plugin and the server. The AI Bridge (MCP) panel shows them; or run `kritapilot --version`.
      placeholder: Krita 5.3.4, plugin 2026.11.8.35, server 2026.11.8.35
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - AI Chat inside Krita
        - An MCP client (Claude, ChatGPT, Cursor, ...)
        - The AI Bridge (MCP) panel
        - Installing or updating
        - Image or video generation
        - Something else
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: |
        Open **Logs…** (in the AI Chat or AI Bridge panel), type ✗ in the filter to see only failures, and paste
        the lines around the problem. Keys are masked in the logs, so they are safe to share.
        If Krita froze, attach `~/.kritapilot/hang.log` too.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the prompt you used, the provider and model, ...
